---
- name: Configure web servers with standard packages
  hosts: web
  become: true

  tasks:
    - name: Install curl
      apt:
        name: curl
        state: present
        update_cache: yes

    - name: Install git
      apt:
        name: git
        state: present

    - name: Create application directory
      file:
        path: /opt/techorbit
        state: directory
        mode: '0755'

    - name: Show server info
      debug:
        msg: "Configured {{ inventory_hostname }} successfully"
